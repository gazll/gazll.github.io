<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" role="img" aria-label="Three exposure controls, each paying for light with a different cost">
  <rect width="640" height="400" fill="#F8FAFC"/>
  <text x="320" y="34" text-anchor="middle" font-family="'Space Grotesk',sans-serif" font-size="19" font-weight="600" fill="#14233A">One stop of light, three different bills</text>

  <g font-family="'IBM Plex Mono',monospace" font-size="12" font-weight="600">
    <rect x="34" y="70" width="176" height="52" rx="11" fill="#E7EAF6" stroke="#3D4E8F"/>
    <text x="122" y="94" text-anchor="middle" fill="#3D4E8F">SHUTTER</text>
    <text x="122" y="112" text-anchor="middle" font-size="10" font-weight="400" fill="#42536C">1/125 → 1/60 s</text>

    <rect x="232" y="70" width="176" height="52" rx="11" fill="#E4F1EB" stroke="#085239"/>
    <text x="320" y="94" text-anchor="middle" fill="#085239">APERTURE</text>
    <text x="320" y="112" text-anchor="middle" font-size="10" font-weight="400" fill="#42536C">f/4 → f/2.8</text>

    <rect x="430" y="70" width="176" height="52" rx="11" fill="#faf5e9" stroke="#846938"/>
    <text x="518" y="94" text-anchor="middle" fill="#846938">ISO</text>
    <text x="518" y="112" text-anchor="middle" font-size="10" font-weight="400" fill="#42536C">200 → 400</text>
  </g>

  <g stroke="#C6CFDC" stroke-width="1.6">
    <line x1="122" y1="122" x2="122" y2="170"/>
    <line x1="320" y1="122" x2="320" y2="170"/>
    <line x1="518" y1="122" x2="518" y2="170"/>
  </g>
  <g fill="#C6CFDC">
    <polygon points="122,178 117,168 127,168"/>
    <polygon points="320,178 315,168 325,168"/>
    <polygon points="518,178 513,168 523,168"/>
  </g>

  <g font-family="'IBM Plex Sans',system-ui,sans-serif" font-size="12.5" fill="#42536C">
    <rect x="34" y="184" width="176" height="86" rx="11" fill="#FFFFFF" stroke="#DBE1EA"/>
    <text x="122" y="206" text-anchor="middle" font-size="10" font-family="'IBM Plex Mono',monospace" letter-spacing="0.8" fill="#AE4536">COSTS</text>
    <text x="122" y="228" text-anchor="middle" font-weight="600" fill="#14233A">Motion</text>
    <text x="122" y="248" text-anchor="middle" font-size="11">blur vs freeze;</text>
    <text x="122" y="263" text-anchor="middle" font-size="11">shake grows with mm</text>

    <rect x="232" y="184" width="176" height="86" rx="11" fill="#FFFFFF" stroke="#DBE1EA"/>
    <text x="320" y="206" text-anchor="middle" font-size="10" font-family="'IBM Plex Mono',monospace" letter-spacing="0.8" fill="#AE4536">COSTS</text>
    <text x="320" y="228" text-anchor="middle" font-weight="600" fill="#14233A">Depth of field</text>
    <text x="320" y="248" text-anchor="middle" font-size="11">aberration wide open,</text>
    <text x="320" y="263" text-anchor="middle" font-size="11">diffraction stopped down</text>

    <rect x="430" y="184" width="176" height="86" rx="11" fill="#FFFFFF" stroke="#DBE1EA"/>
    <text x="518" y="206" text-anchor="middle" font-size="10" font-family="'IBM Plex Mono',monospace" letter-spacing="0.8" fill="#AE4536">COSTS</text>
    <text x="518" y="228" text-anchor="middle" font-weight="600" fill="#14233A">Visible noise</text>
    <text x="518" y="248" text-anchor="middle" font-size="11">amplifies signal —</text>
    <text x="518" y="263" text-anchor="middle" font-size="11">collects no extra light</text>
  </g>

  <rect x="34" y="296" width="572" height="70" rx="12" fill="#FFFFFF" stroke="#C6CFDC" stroke-dasharray="5 4"/>
  <text x="320" y="322" text-anchor="middle" font-family="'IBM Plex Mono',monospace" font-size="10" letter-spacing="1" fill="#085239">SAME BRIGHTNESS, DIFFERENT PHOTOGRAPH</text>
  <text x="320" y="346" text-anchor="middle" font-family="'IBM Plex Sans',system-ui,sans-serif" font-size="12.5" fill="#42536C">Brightness is the only property all three share. Decide the cost first, exposure second.</text>
</svg>
