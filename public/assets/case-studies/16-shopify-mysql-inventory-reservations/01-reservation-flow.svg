<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">Shopify inventory reservations in MySQL</title>
  <desc id="desc">Concurrent checkouts claim different unit rows with SKIP LOCKED while reservations and the inventory ledger share one transaction boundary.</desc>
  <defs>
    <linearGradient id="bg16" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#172554"/>
    </linearGradient>
    <filter id="shadow16" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#020617" flood-opacity=".35"/>
    </filter>
    <marker id="arrow16" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#67e8f9"/>
    </marker>
  </defs>
  <rect width="1200" height="650" rx="32" fill="url(#bg16)"/>
  <text x="60" y="70" fill="#f8fafc" font-family="Inter,Segoe UI,sans-serif" font-size="32" font-weight="700">Inventory reservation: one correctness boundary</text>
  <text x="60" y="105" fill="#94a3b8" font-family="Inter,Segoe UI,sans-serif" font-size="18">Bounded unit rows spread contention; the ledger remains authoritative.</text>

  <g filter="url(#shadow16)" font-family="Inter,Segoe UI,sans-serif">
    <rect x="60" y="170" width="220" height="300" rx="22" fill="#172033" stroke="#334155"/>
    <text x="90" y="215" fill="#cbd5e1" font-size="18" font-weight="700">CONCURRENT CHECKOUTS</text>
    <g fill="#1e293b" stroke="#475569">
      <rect x="90" y="250" width="160" height="48" rx="12"/>
      <rect x="90" y="318" width="160" height="48" rx="12"/>
      <rect x="90" y="386" width="160" height="48" rx="12"/>
    </g>
    <g fill="#e2e8f0" font-size="18">
      <text x="132" y="281">Buyer A</text>
      <text x="132" y="349">Buyer B</text>
      <text x="132" y="417">Buyer C</text>
    </g>

    <rect x="385" y="150" width="755" height="390" rx="24" fill="#111c33" stroke="#2563eb" stroke-width="2"/>
    <text x="420" y="195" fill="#93c5fd" font-size="18" font-weight="700">MYSQL · LOCAL ACID TRANSACTION</text>

    <rect x="425" y="235" width="355" height="245" rx="18" fill="#172033" stroke="#0891b2"/>
    <text x="455" y="275" fill="#67e8f9" font-size="21" font-weight="700">reservation_units</text>
    <text x="455" y="305" fill="#94a3b8" font-size="16">bounded pool · cap 1,000</text>
    <g font-size="16" font-weight="700">
      <rect x="455" y="335" width="80" height="55" rx="10" fill="#164e63" stroke="#22d3ee"/>
      <rect x="550" y="335" width="80" height="55" rx="10" fill="#1e3a5f" stroke="#60a5fa"/>
      <rect x="645" y="335" width="80" height="55" rx="10" fill="#3f315f" stroke="#a78bfa"/>
      <text x="475" y="369" fill="#cffafe">A #1</text>
      <text x="570" y="369" fill="#dbeafe">B #2</text>
      <text x="665" y="369" fill="#ede9fe">C #3</text>
    </g>
    <text x="455" y="430" fill="#e2e8f0" font-size="17">FOR UPDATE SKIP LOCKED</text>
    <text x="455" y="458" fill="#94a3b8" font-size="15">locked row → take the next unit</text>

    <rect x="830" y="235" width="270" height="245" rx="18" fill="#172033" stroke="#22c55e"/>
    <text x="860" y="275" fill="#86efac" font-size="21" font-weight="700">inventory_ledger</text>
    <text x="860" y="310" fill="#cbd5e1" font-size="16">authoritative quantity</text>
    <path d="M860 350 H1065" stroke="#334155" stroke-width="2"/>
    <text x="860" y="390" fill="#e2e8f0" font-size="17">reserve · claim · refill</text>
    <text x="860" y="425" fill="#94a3b8" font-size="15">same database boundary</text>
  </g>

  <path d="M280 320 C325 320 335 320 380 320" fill="none" stroke="#67e8f9" stroke-width="4" marker-end="url(#arrow16)"/>
  <path d="M785 357 C805 357 805 357 825 357" fill="none" stroke="#67e8f9" stroke-width="4" marker-end="url(#arrow16)"/>
  <rect x="385" y="570" width="755" height="42" rx="12" fill="#0f2f2b" stroke="#15803d"/>
  <text x="762" y="597" text-anchor="middle" fill="#bbf7d0" font-family="Inter,Segoe UI,sans-serif" font-size="17">Inline refill only when pool capacity is empty and ledger stock remains</text>
</svg>
