<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Discord message storage architecture</title>
  <desc id="desc">Requests are consistently routed by channel to Rust data services, where duplicate reads are coalesced before reaching ScyllaDB.</desc>
  <rect width="1200" height="620" fill="#f8fafc"/>
  <text x="600" y="62" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#111827">CONTROL THE LOAD BEFORE IT REACHES STORAGE</text>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="55" y="230" width="210" height="110" rx="16" fill="#eef2ff" stroke="#5865f2" stroke-width="3"/>
    <text x="160" y="277" font-size="22" font-weight="700" fill="#3730a3">API monolith</text>
    <text x="160" y="309" font-size="16" fill="#475569">channel_id as routing key</text>
    <rect x="355" y="170" width="255" height="230" rx="16" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/>
    <text x="482" y="218" font-size="22" font-weight="700" fill="#1e3a8a">Rust data service</text>
    <rect x="390" y="250" width="185" height="52" rx="10" fill="#ffffff" stroke="#60a5fa"/>
    <text x="482" y="282" font-size="16" fill="#1e3a8a">consistent routing</text>
    <rect x="390" y="320" width="185" height="52" rx="10" fill="#ffffff" stroke="#60a5fa"/>
    <text x="482" y="352" font-size="16" fill="#1e3a8a">request coalescing</text>
    <path d="M745 195 C710 195 688 216 688 250 L688 320 C688 354 710 375 745 375 L955 375 C990 375 1012 354 1012 320 L1012 250 C1012 216 990 195 955 195 Z" fill="#ecfdf5" stroke="#059669" stroke-width="3"/>
    <ellipse cx="850" cy="195" rx="105" ry="30" fill="#d1fae5" stroke="#059669" stroke-width="3"/>
    <text x="850" y="276" font-size="26" font-weight="700" fill="#065f46">ScyllaDB</text>
    <text x="850" y="310" font-size="17" fill="#047857">bounded database work</text>
    <text x="850" y="338" font-size="17" fill="#047857">shard-per-core isolation</text>
    <path d="M265 285 H345" stroke="#475569" stroke-width="4" marker-end="url(#arrow)"/>
    <path d="M610 285 H735" stroke="#475569" stroke-width="4" marker-end="url(#arrow)"/>
    <text x="302" y="267" font-size="14" fill="#475569">hash</text>
    <text x="672" y="267" font-size="14" fill="#475569">one query</text>
    <rect x="350" y="465" width="500" height="76" rx="14" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
    <text x="600" y="497" font-size="18" font-weight="700" fill="#9a3412">N callers request the same row</text>
    <text x="600" y="524" font-size="17" fill="#9a3412">1 worker queries storage · N subscribers receive the result</text>
  </g>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 Z" fill="#475569"/></marker></defs>
</svg>
