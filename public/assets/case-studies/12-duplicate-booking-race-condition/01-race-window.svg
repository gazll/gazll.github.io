<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 460" width="880" height="460" font-family="IBM Plex Sans, Segoe UI, system-ui, sans-serif">
  <rect width="880" height="460" fill="#f7f5f1"/>
  <text x="32" y="42" font-size="19" font-weight="600" fill="#1c1917">Two requests, one 25 ms window</text>
  <text x="32" y="66" font-size="14" fill="#57534e">Both read Init before either writes Booking. The guard never sees a conflict.</text>

  <!-- lanes -->
  <text x="32" y="106" font-size="13" font-weight="600" fill="#44403c">Request 1</text>
  <text x="470" y="106" font-size="13" font-weight="600" fill="#44403c">Request 2</text>
  <line x1="32" y1="116" x2="420" y2="116" stroke="#d6d3d1" stroke-width="1"/>
  <line x1="470" y1="116" x2="858" y2="116" stroke="#d6d3d1" stroke-width="1"/>

  <!-- request 1 steps -->
  <rect x="32" y="136" width="388" height="46" rx="6" fill="#ffffff" stroke="#d6d3d1"/>
  <text x="46" y="159" font-size="13" font-weight="600" fill="#1c1917">15:21:44,300 — SELECT session</text>
  <text x="46" y="175" font-size="12.5" fill="#57534e">status = Init  ·  5 ms</text>

  <rect x="32" y="200" width="388" height="46" rx="6" fill="#ffffff" stroke="#d6d3d1"/>
  <text x="46" y="223" font-size="13" font-weight="600" fill="#1c1917">check status → valid</text>
  <text x="46" y="239" font-size="12.5" fill="#57534e">0.1 ms  ·  the guard passes</text>

  <rect x="32" y="264" width="388" height="46" rx="6" fill="#ffffff" stroke="#d6d3d1"/>
  <text x="46" y="287" font-size="13" font-weight="600" fill="#1c1917">UPDATE status = Booking</text>
  <text x="46" y="303" font-size="12.5" fill="#57534e">20 ms</text>

  <rect x="32" y="328" width="388" height="44" rx="6" fill="#ecfdf5" stroke="#059669"/>
  <text x="46" y="356" font-size="13" font-weight="600" fill="#065f46">Do booking → PNR #1</text>

  <!-- request 2 steps -->
  <rect x="470" y="160" width="388" height="46" rx="6" fill="#ffffff" stroke="#d6d3d1"/>
  <text x="484" y="183" font-size="13" font-weight="600" fill="#1c1917">15:21:44,302 — SELECT session</text>
  <text x="484" y="199" font-size="12.5" fill="#57534e">status = Init  ·  still the old value</text>

  <rect x="470" y="224" width="388" height="46" rx="6" fill="#ffffff" stroke="#d6d3d1"/>
  <text x="484" y="247" font-size="13" font-weight="600" fill="#1c1917">check status → valid</text>
  <text x="484" y="263" font-size="12.5" fill="#57534e">the same snapshot of the past</text>

  <rect x="470" y="288" width="388" height="46" rx="6" fill="#ffffff" stroke="#d6d3d1"/>
  <text x="484" y="311" font-size="13" font-weight="600" fill="#1c1917">UPDATE status = Booking</text>
  <text x="484" y="327" font-size="12.5" fill="#57534e">overwrites, reports success</text>

  <rect x="470" y="352" width="388" height="44" rx="6" fill="#fef2f2" stroke="#b91c1c"/>
  <text x="484" y="380" font-size="13" font-weight="600" fill="#991b1b">Do booking → PNR #2  (DUPLICATE)</text>

  <!-- window bracket -->
  <line x1="424" y1="146" x2="424" y2="310" stroke="#b45309" stroke-width="2"/>
  <line x1="418" y1="146" x2="430" y2="146" stroke="#b45309" stroke-width="2"/>
  <line x1="418" y1="310" x2="430" y2="310" stroke="#b45309" stroke-width="2"/>
  <text x="436" y="126" font-size="12.5" font-weight="600" fill="#b45309">read → write: 25 ms</text>
  <text x="436" y="142" font-size="12.5" fill="#92400e">requests arrive 2 ms apart</text>

  <text x="32" y="432" font-size="12.5" fill="#57534e">The two requests land on different Web instances, so no in-process lock can see both.</text>
</svg>
