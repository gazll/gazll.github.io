<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" role="img" aria-labelledby="title desc">
  <title id="title">Transactional Outbox order workflow</title>
  <desc id="desc">Service A commits an order update and outbox event in one database transaction. A relay publishes the event to a broker. Service B deduplicates the event and commits its own business data.</desc>
  <defs>
    <linearGradient id="bg15" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#081525"/><stop offset="1" stop-color="#102d3d"/></linearGradient>
    <linearGradient id="db15" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#31c8ff"/><stop offset="1" stop-color="#1677d2"/></linearGradient>
    <linearGradient id="event15" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#73e2a7"/><stop offset="1" stop-color="#20a36a"/></linearGradient>
    <marker id="arrow15" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0l10 5-10 5z" fill="#91a8bb"/></marker>
    <filter id="shadow15" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity=".28"/></filter>
  </defs>
  <rect width="1200" height="660" rx="28" fill="url(#bg15)"/>
  <text x="600" y="54" text-anchor="middle" fill="#eef7ff" font-family="system-ui,sans-serif" font-size="25" font-weight="700">One atomic write · at-least-once delivery · idempotent effect</text>

  <g filter="url(#shadow15)">
    <rect x="55" y="102" width="370" height="470" rx="24" fill="#10263a" stroke="#2e526b" stroke-width="2"/>
    <rect x="775" y="102" width="370" height="470" rx="24" fill="#10263a" stroke="#2e526b" stroke-width="2"/>
  </g>
  <text x="240" y="143" text-anchor="middle" fill="#70d7ff" font-family="system-ui,sans-serif" font-size="18" font-weight="700">SERVICE A · ORDER</text>
  <text x="960" y="143" text-anchor="middle" fill="#70d7ff" font-family="system-ui,sans-serif" font-size="18" font-weight="700">SERVICE B · PAYMENT</text>

  <rect x="115" y="178" width="250" height="76" rx="16" fill="#172f45" stroke="#70d7ff"/>
  <text x="240" y="210" text-anchor="middle" fill="#fff" font-family="system-ui,sans-serif" font-size="20" font-weight="650">Order Service</text>
  <text x="240" y="235" text-anchor="middle" fill="#9db5c7" font-family="system-ui,sans-serif" font-size="14">checkout(order-123)</text>

  <path d="M240 254v48" stroke="#91a8bb" stroke-width="3" marker-end="url(#arrow15)"/>
  <rect x="100" y="316" width="280" height="190" rx="20" fill="#0b1c2b" stroke="#31c8ff" stroke-width="2"/>
  <text x="240" y="348" text-anchor="middle" fill="#31c8ff" font-family="system-ui,sans-serif" font-size="17" font-weight="700">ONE DB TRANSACTION</text>
  <rect x="128" y="370" width="224" height="48" rx="12" fill="url(#db15)"/>
  <text x="240" y="400" text-anchor="middle" fill="#fff" font-family="system-ui,sans-serif" font-size="16" font-weight="650">orders: PAYMENT_PENDING</text>
  <rect x="128" y="434" width="224" height="48" rx="12" fill="url(#event15)"/>
  <text x="240" y="464" text-anchor="middle" fill="#062719" font-family="system-ui,sans-serif" font-size="16" font-weight="700">outbox: evt-456</text>

  <rect x="465" y="197" width="150" height="72" rx="36" fill="#172f45" stroke="#73e2a7" stroke-width="2"/>
  <text x="540" y="225" text-anchor="middle" fill="#fff" font-family="system-ui,sans-serif" font-size="17" font-weight="700">Outbox Relay</text>
  <text x="540" y="247" text-anchor="middle" fill="#9db5c7" font-family="system-ui,sans-serif" font-size="13">poll · retry · ack</text>
  <path d="M380 398C450 398 442 269 485 254" fill="none" stroke="#91a8bb" stroke-width="3" marker-end="url(#arrow15)"/>

  <g filter="url(#shadow15)">
    <path d="M645 215h100c13 0 24 11 24 24s-11 24-24 24H645c-13 0-24-11-24-24s11-24 24-24z" fill="#f5a84b"/>
  </g>
  <text x="695" y="245" text-anchor="middle" fill="#2d1700" font-family="system-ui,sans-serif" font-size="17" font-weight="800">BROKER</text>
  <path d="M615 233h6" stroke="#91a8bb" stroke-width="3" marker-end="url(#arrow15)"/>
  <path d="M769 239h61" stroke="#91a8bb" stroke-width="3" marker-end="url(#arrow15)"/>

  <rect x="835" y="178" width="250" height="76" rx="16" fill="#172f45" stroke="#70d7ff"/>
  <text x="960" y="210" text-anchor="middle" fill="#fff" font-family="system-ui,sans-serif" font-size="20" font-weight="650">Consumer</text>
  <text x="960" y="235" text-anchor="middle" fill="#9db5c7" font-family="system-ui,sans-serif" font-size="14">receive(evt-456)</text>
  <path d="M960 254v48" stroke="#91a8bb" stroke-width="3" marker-end="url(#arrow15)"/>
  <rect x="820" y="316" width="280" height="190" rx="20" fill="#0b1c2b" stroke="#31c8ff" stroke-width="2"/>
  <text x="960" y="348" text-anchor="middle" fill="#31c8ff" font-family="system-ui,sans-serif" font-size="17" font-weight="700">ONE DB TRANSACTION</text>
  <rect x="848" y="370" width="224" height="48" rx="12" fill="url(#event15)"/>
  <text x="960" y="400" text-anchor="middle" fill="#062719" font-family="system-ui,sans-serif" font-size="16" font-weight="700">inbox: evt-456</text>
  <rect x="848" y="434" width="224" height="48" rx="12" fill="url(#db15)"/>
  <text x="960" y="464" text-anchor="middle" fill="#fff" font-family="system-ui,sans-serif" font-size="16" font-weight="650">payment: AUTHORIZED</text>

  <rect x="430" y="318" width="340" height="110" rx="18" fill="#132b3d" stroke="#f5a84b" stroke-dasharray="7 6"/>
  <text x="600" y="350" text-anchor="middle" fill="#f9c77f" font-family="system-ui,sans-serif" font-size="16" font-weight="700">THE INTENTIONAL DUPLICATE WINDOW</text>
  <text x="600" y="378" text-anchor="middle" fill="#c6d5df" font-family="system-ui,sans-serif" font-size="14">Broker ACK succeeds · relay crashes before marking published</text>
  <text x="600" y="404" text-anchor="middle" fill="#73e2a7" font-family="system-ui,sans-serif" font-size="14" font-weight="650">Retry is safe because evt-456 is a unique inbox key</text>

  <text x="600" y="620" text-anchor="middle" fill="#9db5c7" font-family="system-ui,sans-serif" font-size="15">Outbox prevents lost intent. Inbox prevents duplicate effect. Saga owns business order.</text>
</svg>
