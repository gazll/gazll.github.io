<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">Verification bandwidth</title>
  <desc id="desc">Automation cost falls while human verification bandwidth remains bounded; safe agentic scale requires an intent, execution and verification loop.</desc>
  <rect width="1200" height="680" fill="#F7F4ED"/>
  <rect x="54" y="48" width="1092" height="584" rx="22" fill="#FFFDF8" stroke="#D8D1C3" stroke-width="2"/>
  <text x="96" y="108" fill="#14233A" font-family="IBM Plex Sans, Arial, sans-serif" font-size="32" font-weight="700">When execution gets cheap</text>
  <text x="96" y="144" fill="#5B6574" font-family="IBM Plex Sans, Arial, sans-serif" font-size="18">the scarce resource moves to verification</text>
  <line x1="150" y1="430" x2="1040" y2="430" stroke="#7B8491" stroke-width="2"/>
  <line x1="150" y1="430" x2="150" y2="190" stroke="#7B8491" stroke-width="2"/>
  <text x="995" y="466" fill="#5B6574" font-family="IBM Plex Mono, monospace" font-size="15">agent scale</text>
  <text x="86" y="202" fill="#5B6574" font-family="IBM Plex Mono, monospace" font-size="15" transform="rotate(-90 86 202)">cost / bandwidth</text>
  <rect x="580" y="214" width="390" height="216" fill="#F9E7E2" opacity="0.75"/>
  <text x="630" y="248" fill="#9A3F32" font-family="IBM Plex Sans, Arial, sans-serif" font-size="18" font-weight="700">measurability gap</text>
  <text x="630" y="276" fill="#9A3F32" font-family="IBM Plex Sans, Arial, sans-serif" font-size="15">unchecked output becomes latent risk</text>
  <path d="M170 382 C330 360 440 320 560 274 C690 226 820 190 1020 166" fill="none" stroke="#AE4536" stroke-width="7"/>
  <text x="790" y="182" fill="#9A3F32" font-family="IBM Plex Sans, Arial, sans-serif" font-size="17" font-weight="700">cost to automate cA</text>
  <path d="M170 302 C380 300 560 301 760 302 C870 302 950 304 1020 304" fill="none" stroke="#0B6E4F" stroke-width="7"/>
  <text x="770" y="290" fill="#085239" font-family="IBM Plex Sans, Arial, sans-serif" font-size="17" font-weight="700">human verification bandwidth</text>
  <line x1="580" y1="214" x2="580" y2="430" stroke="#AE4536" stroke-width="2" stroke-dasharray="8 8"/>
  <text x="548" y="454" fill="#9A3F32" font-family="IBM Plex Mono, monospace" font-size="14">scale without proof</text>
  <rect x="108" y="500" width="300" height="86" rx="12" fill="#E7EAF6" stroke="#3D4E8F" stroke-width="2"/>
  <rect x="450" y="500" width="300" height="86" rx="12" fill="#E4F1EB" stroke="#0B6E4F" stroke-width="2"/>
  <rect x="792" y="500" width="300" height="86" rx="12" fill="#F6E8E5" stroke="#AE4536" stroke-width="2"/>
  <text x="258" y="535" text-anchor="middle" fill="#3D4E8F" font-family="IBM Plex Sans, Arial, sans-serif" font-size="21" font-weight="700">HUMAN INTENT</text>
  <text x="258" y="564" text-anchor="middle" fill="#42536C" font-family="IBM Plex Sans, Arial, sans-serif" font-size="15">invariants and boundaries</text>
  <text x="600" y="535" text-anchor="middle" fill="#085239" font-family="IBM Plex Sans, Arial, sans-serif" font-size="21" font-weight="700">AGENT EXECUTION</text>
  <text x="600" y="564" text-anchor="middle" fill="#42536C" font-family="IBM Plex Sans, Arial, sans-serif" font-size="15">fast, bounded, observable</text>
  <text x="942" y="535" text-anchor="middle" fill="#9A3F32" font-family="IBM Plex Sans, Arial, sans-serif" font-size="21" font-weight="700">VERIFICATION</text>
  <text x="942" y="564" text-anchor="middle" fill="#42536C" font-family="IBM Plex Sans, Arial, sans-serif" font-size="15">evidence and recovery</text>
  <path d="M408 543 H438" fill="none" stroke="#42536C" stroke-width="3"/>
  <path d="M750 543 H780" fill="none" stroke="#42536C" stroke-width="3"/>
  <path d="M1030 600 C760 640 420 640 180 600" fill="none" stroke="#3D4E8F" stroke-width="3" stroke-dasharray="10 8"/>
  <text x="600" y="614" text-anchor="middle" fill="#3D4E8F" font-family="IBM Plex Mono, monospace" font-size="14">feedback, practice, provenance</text>
</svg>
