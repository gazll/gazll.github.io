<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" role="img" aria-label="Which storage layer covers which failure: redundancy, snapshots and an off-site copy">
  <rect width="640" height="400" fill="#F8FAFC"/>
  <text x="320" y="34" text-anchor="middle" font-family="'Space Grotesk',sans-serif" font-size="19" font-weight="600" fill="#14233A">Three layers, three different failures</text>

  <g font-family="'IBM Plex Mono',monospace" font-size="10" letter-spacing="0.7" fill="#7E8DA3" text-anchor="middle">
    <text x="300" y="70">RAIDZ</text>
    <text x="410" y="70">SNAPSHOT</text>
    <text x="530" y="70">OFF-SITE</text>
  </g>

  <g font-family="'IBM Plex Sans',system-ui,sans-serif" font-size="12.5" fill="#42536C">
    <g fill="#14233A" font-weight="500">
      <text x="34" y="106">Drive dies</text>
      <text x="34" y="146">Silent bit rot</text>
      <text x="34" y="186">Accidental delete</text>
      <text x="34" y="226">Ransomware</text>
      <text x="34" y="266">Pool / RAM corruption</text>
      <text x="34" y="306">Fire, flood, theft</text>
    </g>
  </g>

  <g stroke="#DBE1EA" stroke-width="1">
    <line x1="34" y1="118" x2="606" y2="118"/>
    <line x1="34" y1="158" x2="606" y2="158"/>
    <line x1="34" y1="198" x2="606" y2="198"/>
    <line x1="34" y1="238" x2="606" y2="238"/>
    <line x1="34" y1="278" x2="606" y2="278"/>
  </g>

  <!-- covered: emerald disc with a tick; not covered: hollow clay ring -->
  <g>
    <g fill="#E4F1EB" stroke="#085239" stroke-width="1.4">
      <circle cx="300" cy="101" r="11"/><circle cx="530" cy="101" r="11"/>
      <circle cx="300" cy="141" r="11"/><circle cx="530" cy="141" r="11"/>
      <circle cx="410" cy="181" r="11"/><circle cx="530" cy="181" r="11"/>
      <circle cx="410" cy="221" r="11"/><circle cx="530" cy="221" r="11"/>
      <circle cx="530" cy="261" r="11"/>
      <circle cx="530" cy="301" r="11"/>
    </g>
    <g stroke="#085239" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <polyline points="295,101 299,105 306,97"/><polyline points="525,101 529,105 536,97"/>
      <polyline points="295,141 299,145 306,137"/><polyline points="525,141 529,145 536,137"/>
      <polyline points="405,181 409,185 416,177"/><polyline points="525,181 529,185 536,177"/>
      <polyline points="405,221 409,225 416,217"/><polyline points="525,221 529,225 536,217"/>
      <polyline points="525,261 529,265 536,257"/>
      <polyline points="525,301 529,305 536,297"/>
    </g>

    <g fill="#F6E8E5" stroke="#AE4536" stroke-width="1.4">
      <circle cx="410" cy="101" r="11"/>
      <circle cx="410" cy="141" r="11"/>
      <circle cx="300" cy="181" r="11"/>
      <circle cx="300" cy="221" r="11"/>
      <circle cx="300" cy="261" r="11"/><circle cx="410" cy="261" r="11"/>
      <circle cx="300" cy="301" r="11"/><circle cx="410" cy="301" r="11"/>
    </g>
    <g stroke="#AE4536" stroke-width="2" stroke-linecap="round">
      <line x1="406" y1="97" x2="414" y2="105"/><line x1="414" y1="97" x2="406" y2="105"/>
      <line x1="406" y1="137" x2="414" y2="145"/><line x1="414" y1="137" x2="406" y2="145"/>
      <line x1="296" y1="177" x2="304" y2="185"/><line x1="304" y1="177" x2="296" y2="185"/>
      <line x1="296" y1="217" x2="304" y2="225"/><line x1="304" y1="217" x2="296" y2="225"/>
      <line x1="296" y1="257" x2="304" y2="265"/><line x1="304" y1="257" x2="296" y2="265"/>
      <line x1="406" y1="257" x2="414" y2="265"/><line x1="414" y1="257" x2="406" y2="265"/>
      <line x1="296" y1="297" x2="304" y2="305"/><line x1="304" y1="297" x2="296" y2="305"/>
      <line x1="406" y1="297" x2="414" y2="305"/><line x1="414" y1="297" x2="406" y2="305"/>
    </g>
  </g>

  <rect x="34" y="328" width="572" height="46" rx="12" fill="#FFFFFF" stroke="#C6CFDC" stroke-dasharray="5 4"/>
  <text x="320" y="356" text-anchor="middle" font-family="'IBM Plex Sans',system-ui,sans-serif" font-size="12.5" fill="#42536C">Redundancy covers two rows of six — and both come with a warranty attached.</text>
</svg>
