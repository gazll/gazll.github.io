name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Enforce security guardrails
        shell: bash
        run: |
          tracked_private_files="$(git ls-files public/config.js 'secret/**')"
          if [ -n "$tracked_private_files" ]; then
            echo "::error::Private local files must never be tracked:"
            echo "$tracked_private_files"
            exit 1
          fi

          # Character classes keep this pattern from matching its own source.
          credential_pattern='[-]{5}BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY|A[I]za[0-9A-Za-z_-]{35}|g[h][pousr]_[0-9A-Za-z]{20,}|y[a]29\.[0-9A-Za-z_-]+|"client[_]secret"[[:space:]]*:'
          if git grep -nI -E -e "$credential_pattern" -- .; then
            echo "::error::A private credential pattern was found in tracked files."
            exit 1
          fi

      # Read from Secrets. Note these are not actually secret — the browser
      # needs both, so they are readable in the deployed page source. Storing
      # them here only keeps them out of the repo; real protection is the ID
      # token check in Code.gs. Unset -> site still deploys, in offline mode.
      - name: Generate config.js
        env:
          CLIENT_ID: ${{ secrets.GAZL_GOOGLE_CLIENT_ID }}
          SCRIPT_URL: ${{ secrets.GAZL_SCRIPT_URL }}
        run: |
          # Report lengths, not values: enough to tell "unset" from "set" when
          # the site comes up Offline, without needing to read the values.
          echo "GAZL_GOOGLE_CLIENT_ID: ${#CLIENT_ID} chars"
          echo "GAZL_SCRIPT_URL:       ${#SCRIPT_URL} chars"

          if [ -z "$CLIENT_ID" ] || [ -z "$SCRIPT_URL" ]; then
            echo "::warning::Secrets not visible to this run - deploying in OFFLINE mode. Check: (1) names are exactly GAZL_GOOGLE_CLIENT_ID and GAZL_SCRIPT_URL; (2) they are on THIS repo, under Secrets > Actions; (3) the run started after they were saved - re-run if not."
          else
            echo "Sync enabled."
          fi

          # jq so a stray quote cannot break the JS literal.
          {
            echo "// Generated by deploy.yml - do not edit."
            echo "export const GOOGLE_CLIENT_ID = $(jq -rn --arg v "$CLIENT_ID" '$v | @json');"
            echo "export const SCRIPT_URL = $(jq -rn --arg v "$SCRIPT_URL" '$v | @json');"
          } > public/config.js

      # One entrypoint, shared with local development: content validation,
      # ESM syntax of every shipped module, the console-logging ban and every
      # tests/*.test.mjs. Test files are discovered from disk, so adding one
      # does not also require editing this workflow.
      - name: Run checks
        run: node tools/check.mjs

      # Stamp only the artifact that will be uploaded. Tests intentionally run
      # against the source module paths before their deploy-only ?v= query.
      - name: Stamp deploy version
        env:
          GAZL_DEPLOY_SHA: ${{ github.sha }}
        run: node tools/stamp-assets.mjs "$GAZL_DEPLOY_SHA"

      # Re-parse after stamping: the rewrite touches every import specifier,
      # so a bad substitution would otherwise ship as a blank page.
      - name: Check stamped JavaScript syntax
        run: node tools/check.mjs --only syntax

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: public

      - id: deployment
        uses: actions/deploy-pages@v5
